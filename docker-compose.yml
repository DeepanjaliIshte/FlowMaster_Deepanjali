services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: flowmaster-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:16
    container_name: flowmaster-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flowmaster
      POSTGRES_USER: flowmaster
      POSTGRES_PASSWORD: flowmaster_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmaster -d flowmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    build: ./services/orchestrator
    environment:
      PORT: 3000
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://flowmaster:flowmaster_dev_password@postgres:5432/flowmaster
      WORKFLOW_FILE: /app/config/workflow.yaml
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped


  verification:
    build: ./services/verification
    environment:
      PORT: 3001
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://flowmaster:flowmaster_dev_password@postgres:5432/flowmaster
    ports:
      - "3001:3001"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped


  credit:
    build: ./services/credit
    environment:
      PORT: 3002
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://flowmaster:flowmaster_dev_password@postgres:5432/flowmaster
    ports:
      - "3002:3002"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped


volumes:
  postgres_data:
